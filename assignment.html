<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignments - CampusAI</title>

<style>
  body { margin:0; font-family:'Poppins', sans-serif; background:#0b1120; color:white; }

  .navbar {
    height:60px;
    background:#020617;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    border-bottom:1px solid #1e293b;
  }

  .container { display:flex; flex-wrap:wrap; }

  .sidebar {
    width:220px;
    min-width:150px;
    background:#020617;
    height:calc(100vh - 60px);
    padding:20px;
  }

  .sidebar ul { list-style:none; padding:0; }
  .sidebar li {
    padding:10px;
    border-radius:8px;
    margin:10px 0;
    cursor:pointer;
  }

  .sidebar li:hover { background:#1e293b; }

  .main {
    flex:1;
    min-width:300px;
    padding:20px;
  }

  .card {
    background:#020617;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
  }

  @media screen and (max-width:768px) {
    .container { flex-direction:column; }
    .sidebar { width:100%; height:auto; }
  }
</style>

</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <h2>CampusAI 🎓</h2>
  <div>👤 Student</div>
</div>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <ul>
      <li onclick="window.location.href='dashboard.html'">🏠 Dashboard</li>
      <li onclick="window.location.href='notices.html'">📢 Notices</li>
      <li onclick="window.location.href='assignments.html'">📚 Assignments</li>
      <li onclick="window.location.href='notes.html'">📄 Notes</li>
      <li onclick="window.location.href='quiz.html'">📝 Quiz</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>📚 Assignments</h1>

    <div class="card">
      <h3>Physics Assignment</h3>
      <p>Due Date: April 15</p>
      <button>Submit</button>
    </div>

    <div class="card">
      <h3>Math Assignment</h3>
      <p>Due Date: April 18</p>
      <button>Submit</button>
    </div>

    <div class="card">
      <h3>Chemistry Assignment</h3>
      <p>Due Date: April 20</p>
      <button>Submit</button>
    </div>

  </div>

</div>

</body>
</html>
