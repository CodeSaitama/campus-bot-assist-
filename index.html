<!DOCTYPE html>
<html>
<head>
  <title>CampusAI</title>
  <head>
  <title>CampusAI</title>
  <style>
    body {
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 20px;
      color: #38bdf8;
    }

    p {
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: black;
      cursor: pointer;
      margin-left: 5px;
    }

    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>
</head>
  <body>
  <h1>CampusAI </h1>
  <p>Your smart campus assistant</p>

  <h2> Notices</h2>
  <p>Exam registration ends on April 20</p>

  <h2> Assignments</h2>
  <p>Math assignment due tomorrow</p>

  <h2> Scholarships</h2>
  <p>NSP deadline April 25</p>
  <h2>🤖 Ask CampusAI</h2>
  <input type="text" id="userInput" placeholder="Ask something...">
  <button onclick="getAnswer()">Ask</button>
  <p id="response"></p>
    <script>
function getAnswer() {
  let input = document.getElementById("userInput").value.toLowerCase();
  let response = document.getElementById("response");

  if (input.includes("exam")) {
    response.innerText = "Exam registration ends on April 20";
  } 
  else if (input.includes("assignment")) {
    response.innerText = "Math assignment is due tomorrow";
  } 
  else if (input.includes("scholarship")) {
    response.innerText = "Scholarship deadline is April 15";
  } 
  else if (input.includes("email")) {
    response.innerText = "Faculty email: faculty@college.edu";
  }
  else {
    response.innerText = "Sorry, I don't have that info yet.";
  }
}
</script>
</body>
</html>
